basePath: /
definitions:
  dto.AthleteProfileResponse:
    properties:
      experience_level:
        $ref: '#/definitions/profile.ExperienceLevel'
      goal:
        $ref: '#/definitions/profile.Goal'
      height:
        type: number
      user_id:
        type: integer
      weight:
        type: number
    type: object
  dto.CoachProfileResponse:
    properties:
      bio:
        type: string
      specialization:
        type: string
      user_id:
        type: integer
      years_of_exp:
        type: integer
    type: object
  dto.CreateAthleteProfileRequest:
    properties:
      experience_level:
        $ref: '#/definitions/profile.ExperienceLevel'
      goal:
        $ref: '#/definitions/profile.Goal'
      height:
        type: number
      weight:
        type: number
    required:
    - experience_level
    - goal
    - height
    - weight
    type: object
  dto.CreateCoachProfileRequest:
    properties:
      bio:
        type: string
      specialization:
        type: string
      years_of_exp:
        minimum: 0
        type: integer
    required:
    - bio
    - specialization
    - years_of_exp
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.RegisterResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.UpdateAthleteProfileRequest:
    properties:
      experience_level:
        $ref: '#/definitions/profile.ExperienceLevel'
      goal:
        $ref: '#/definitions/profile.Goal'
      height:
        type: number
      weight:
        type: number
    required:
    - experience_level
    - goal
    - height
    - weight
    type: object
  dto.UpdateCoachProfileRequest:
    properties:
      bio:
        type: string
      specialization:
        type: string
      years_of_exp:
        minimum: 0
        type: integer
    required:
    - bio
    - specialization
    - years_of_exp
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.ValidationErrorResponse:
    properties:
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  profile.ExperienceLevel:
    enum:
    - beginner
    - intermediate
    - advanced
    type: string
    x-enum-varnames:
    - LevelBeginner
    - LevelIntermediate
    - LevelAdvanced
  profile.Goal:
    enum:
    - weight_loss
    - muscle_gain
    - endurance
    - general_health
    type: string
    x-enum-varnames:
    - GoalWeightLoss
    - GoalMuscleGain
    - GoalEndurance
    - GoalGeneralHealth
host: localhost:8080
info:
  contact: {}
  description: Backend API for Gym App
  title: Gym App API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: User Credentials
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: JWT token returned
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Login a user
      tags:
      - users
  /profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
  /profile/athlete:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AthleteProfileResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get athlete profile
      tags:
      - profile
    post:
      consumes:
      - application/json
      description: Create a profile for an athlete user
      parameters:
      - description: Athlete Profile Info
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAthleteProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AthleteProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create athlete profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      parameters:
      - description: Updated Athlete Profile
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAthleteProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AthleteProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update athlete profile
      tags:
      - profile
  /profile/coach:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CoachProfileResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get coach profile
      tags:
      - profile
    post:
      consumes:
      - application/json
      parameters:
      - description: Coach Profile Info
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCoachProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CoachProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create coach profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      parameters:
      - description: Updated Coach Profile
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCoachProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CoachProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update coach profile
      tags:
      - profile
  /register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User Info
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
      summary: Register a new user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
